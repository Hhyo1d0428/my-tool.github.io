<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TXT to EPUB 자동 변환기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 15px; background: #eef1f5; line-height: 1.5; margin: 0; }
        .box { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #1a1a1a; font-size: 22px; }
        
        input[type="text"], input[type="file"], select, button { width: 100%; margin-top: 8px; margin-bottom: 12px; box-sizing: border-box; font-size: 15px; }
        input[type="text"], select { padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; }
        button { background-color: #007aff; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { background-color: #005bb5; }
        .btn-green { background-color: #34c759; }
        .btn-green:active { background-color: #248a3d; }
        .btn-red { background-color: #ff3b30; }
        .btn-small { width: auto; padding: 8px 12px; font-size: 13px; margin: 2px; border-radius: 6px; border: none; color: white; cursor: pointer; }
        
        .section-box { border-top: 2px dashed #ccc; margin-top: 25px; padding-top: 20px; }
        .info-box { background-color: #e7f3fe; color: #0c5460; padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; }
        .check-group { display: flex; flex-wrap: wrap; gap: 10px; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
        .check-group label { font-size: 14px; display: flex; align-items: center; gap: 5px; cursor: pointer; width: 45%; }
        
        .toc-item, .search-item { background: #fff; padding: 12px; border-radius: 8px; margin-top: 8px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .status { font-weight: bold; margin-top: 10px; text-align: center; font-size: 14px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>
    <div class="box">
        <h2>✨ TXT to EPUB 변환 스튜디오</h2>
        <div class="info-box">텍스트 파일을 분석해 완벽한 전자책(EPUB)으로 만들어줍니다. `* * *` 같은 구분선도 자동으로 예쁘게 꾸며줍니다!</div>
        
        <label>1. 텍스트 파일 (.txt) 및 인코딩 선택</label>
        <div style="display: flex; gap: 10px;">
            <input type="file" id="txtInput" accept=".txt" style="flex: 2;">
            <select id="encodingSelect" style="flex: 1; margin-top: 8px; height: 45px; padding: 0 10px;">
                <option value="utf-8">UTF-8 (기본)</option>
                <option value="euc-kr">EUC-KR (깨질 때)</option>
            </select>
        </div>

        <label>2. 표지 이미지 추가 (자동으로 속표지 삽입)</label>
        <input type="file" id="coverInput" accept="image/jpeg, image/png">

        <label>3. 책 정보 입력</label>
        <input type="text" id="bookTitle" placeholder="책 제목 (예: 내가 키운 S급)">
        <input type="text" id="bookAuthor" placeholder="저자 이름">
        <input type="text" id="fileName" placeholder="저장될 파일명 (예: 내키스_완전판.epub)">

        <div class="section-box">
            <label>4. 🤖 목차 자동 스캔 공식 선택</label>
            <p style="font-size: 12px; color: gray; margin-top: 5px;">본문에서 아래 규칙에 해당하는 줄을 찾아 자동으로 목차로 만듭니다.</p>
            <div class="check-group">
                <label><input type="checkbox" value="type1" checked> # 해시태그형 (# 1화)</label>
                <label><input type="checkbox" value="type2" checked> N화 형 (1화, 2화)</label>
                <label><input type="checkbox" value="type9" checked> N권 형 (1권, 2권)</label> <!-- N권 추가 -->
                <label><input type="checkbox" value="type3" checked> 숫자. 형 (1., 01.)</label>
                <label><input type="checkbox" value="type4" checked> 프롤/외전/에필로그</label>
                <label><input type="checkbox" value="type5" checked> N장 형 (제1장, 2장)</label>
                <label><input type="checkbox" value="type6" checked> EP.N 형 (EP.1)</label>
                <label><input type="checkbox" value="type7" checked> 괄호형 ([1], &lt;1화&gt;)</label>
                <label><input type="checkbox" value="type8" checked> 한자형 (一, 二, 三)</label>
            </div>
            <button onclick="scanTOC()" class="btn-green">본문 분석 및 목차 자동 생성</button>
            <p id="scanStatus" class="status"></p>
        </div>

        <div id="editorSection" style="display:none;" class="section-box">
            <label style="color:#856404;">🔍 5. 누락된 목차 직접 검색해서 넣기</label>
            <p style="font-size: 12px; color: #856404; margin-top: 5px;">자동 스캔이 놓친 목차가 있다면 텍스트를 검색해 추가하세요! (추가 시 실제 흐름에 맞게 자동 정렬됩니다)</p>
            <div style="display:flex; gap:5px;">
                <input type="text" id="searchKeyword" placeholder="예: 48화, 특별 외전" style="margin:0;">
                <button onclick="searchMissingTOC()" class="btn-green" style="margin:0; width:90px;">검색</button>
            </div>
            <div id="searchResults" style="margin-top:10px; margin-bottom: 20px;"></div>

            <label>🛠 6. 최종 목차 확인 (내용 삭제 안 됨! 안심하고 ❌ 삭제하세요)</label>
            <div id="tocList" style="max-height: 300px; overflow-y: auto; background: #f4f4f4; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 20px;"></div>

            <button onclick="generateEPUB()">최종 EPUB 생성 및 다운로드</button>
            <p id="downloadStatus" class="status"></p>
        </div>
    </div>

    <script>
        let textLines = [];
        let tocArray = []; 
        let coverFileData = null;
        let coverExtension = "jpg";

        // 공식 엔진에 '권' 단위 스캔 추가 완료
        const regexRules = {
            type1: /^#.*$/,                                    
            type2: /^\s*\d+\s*화.*$/,                          
            type9: /^\s*(제\s*)?\d+\s*권.*$/,                  // 1권, 제2권
            type3: /^\s*\d+\s*\..*$/,                          
            type4: /^\s*(프롤로그|에필로그|에피소드|외전|prologue|epilogue|episode).*$/i, 
            type5: /^\s*(제\s*)?\d+\s*장.*$/,                  
            type6: /^\s*[\[<【].*?[\]>】].*$/,                  
            type7: /^\s*ep\s*\.\s*\d+.*$/i,                    
            type8: /^\s*[一二三四五六七八九十百]+(\s*장|\s*화|\s*권)?.*$/  // 한자형에도 권 추가
        };

        function escapeXml(unsafe) {
            if(!unsafe) return "";
            return unsafe.replace(/[<>&'"]/g, function (c) {
                switch (c) {
                    case '<': return '&lt;'; case '>': return '&gt;';
                    case '&': return '&amp;'; case '\'': return '&apos;'; case '"': return '&quot;';
                }
            });
        }

        async function scanTOC() {
            const txtFile = document.getElementById('txtInput').files[0];
            const coverFile = document.getElementById('coverInput').files[0];
            const stat = document.getElementById('scanStatus');
            
            if (!txtFile) return alert("텍스트 파일을 선택해주세요!");

            stat.innerText = "⏳ 텍스트를 읽고 분석하는 중...";
            stat.className = "status";
            tocArray = [];
            
            if (coverFile) {
                coverFileData = await coverFile.arrayBuffer();
                coverExtension = coverFile.name.split('.').pop().toLowerCase();
            }

            const encoding = document.getElementById('encodingSelect').value;
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const decoder = new TextDecoder(encoding);
                    const text = decoder.decode(e.target.result);
                    textLines = text.split(/\r?\n/);
                    
                    const activeRegexes = [];
                    document.querySelectorAll('.check-group input:checked').forEach(cb => {
                        activeRegexes.push(regexRules[cb.value]);
                    });

                    for (let i = 0; i < textLines.length; i++) {
                        let line = textLines[i].trim();
                        if (line.length === 0 || line.length > 50) continue; 

                        for (let regex of activeRegexes) {
                            if (regex.test(line)) {
                                tocArray.push({ id: Math.random().toString(36).substr(2,9), lineIndex: i, title: line });
                                break; 
                            }
                        }
                    }

                    if (tocArray.length === 0) {
                        alert("조건에 맞는 목차를 하나도 찾지 못했습니다. 직접 검색해서 추가하세요.");
                    }

                    renderTOC();
                    document.getElementById('editorSection').style.display = "block";
                    stat.innerText = `✅ 분석 완료! 총 ${tocArray.length}개의 목차가 자동 인식되었습니다.`;
                    stat.className = "status success";

                } catch(err) {
                    stat.innerText = "❌ 오류: " + err.message;
                    stat.className = "status error";
                }
            };
            reader.readAsArrayBuffer(txtFile);
        }

        // 🌟 이 함수가 수동 추가 시에도 알아서 정렬(Sort)을 해주는 핵심 마법사입니다.
        function renderTOC() {
            // 목차들을 고유한 '줄 번호(lineIndex)' 순서대로 무조건 오름차순 정렬
            tocArray.sort((a, b) => a.lineIndex - b.lineIndex);
            
            const list = document.getElementById('tocList');
            list.innerHTML = "";
            tocArray.forEach((item) => {
                list.innerHTML += `
                <div class="toc-item">
                    <div style="flex:1;">
                        <span style="color:gray; font-size:12px; margin-right:5px;">[줄:${item.lineIndex}]</span>
                        <input type="text" id="toc_input_${item.id}" value="${item.title}" style="width:70%; border:none; border-bottom:1px solid #ccc; padding:5px; margin:0; background:transparent;">
                    </div>
                    <button class="btn-small btn-red" onclick="removeTOC('${item.id}')">❌</button>
                </div>`;
            });
        }

        function removeTOC(id) {
            tocArray = tocArray.filter(item => item.id !== id);
            renderTOC();
        }

        function searchMissingTOC() {
            const kw = document.getElementById('searchKeyword').value.trim();
            const resDiv = document.getElementById('searchResults');
            if(!kw) return alert("검색어를 입력하세요!");
            
            resDiv.innerHTML = "⏳ 스캔 중...";
            let resultsHTML = "";
            let count = 0;

            for (let i = 0; i < textLines.length; i++) {
                let line = textLines[i].trim();
                if (line.includes(kw) && line.length > 0 && line.length < 100 && !tocArray.some(t => t.lineIndex === i)) {
                    let safeLine = escapeXml(line);
                    resultsHTML += `
                    <div class="search-item" style="padding:8px;">
                        <span style="font-size:14px; flex:1;">📄 ${safeLine} <small style="color:gray;">(줄:${i})</small></span>
                        <button class="btn-small btn-green" onclick="addManualTOC(${i}, '${safeLine.replace(/'/g, "\\'")}')">➕ 추가</button>
                    </div>`;
                    count++;
                }
                if (count >= 50) { 
                    resultsHTML += `<p style="font-size:12px; color:gray; text-align:center;">결과가 너무 많습니다. 검색어를 더 자세히 입력해주세요.</p>`;
                    break;
                }
            }
            resDiv.innerHTML = count > 0 ? `<div style="max-height:200px; overflow-y:auto; border:1px solid #ccc; border-radius:5px;">${resultsHTML}</div>` : "<p style='color:red;'>일치하는 결과가 없거나 이미 목차에 추가되었습니다.</p>";
        }

        function addManualTOC(lineIdx, text) {
            // 새로 찾은 목차를 배열에 밀어 넣고, renderTOC()를 실행하면 자동으로 제자리(줄 번호 순서)로 정렬됩니다!
            tocArray.push({ id: Math.random().toString(36).substr(2,9), lineIndex: lineIdx, title: text });
            renderTOC();
            document.getElementById('searchResults').innerHTML = "<p style='color:green; font-weight:bold;'>✅ 목차에 추가되었습니다!</p>";
        }

        async function generateEPUB() {
            if (tocArray.length === 0) return alert("목차가 최소 1개 이상 필요합니다!");
            
            const stat = document.getElementById('downloadStatus');
            stat.innerText = "⏳ EPUB으로 포장 중...";
            stat.className = "status";
            
            const zip = new JSZip();
            zip.file("mimetype", "application/epub+zip", {compression: "STORE"});
            zip.file("META-INF/container.xml", `<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>`);

            const oebps = zip.folder("OEBPS");
            const textFolder = oebps.folder("Text");
            const imgFolder = oebps.folder("Images");

            let bookTitle = document.getElementById('bookTitle').value || "무제";
            let bookAuthor = document.getElementById('bookAuthor').value || "작자미상";
            let uuid = "urn:uuid:" + Date.now();
            
            let manifest = `<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>\n<item id="nav" href="Text/nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>\n`;
            let spine = ``;
            let navMap = ``;
            let navOl = ``;

            if (coverFileData) {
                let coverFileName = `cover.${coverExtension}`;
                imgFolder.file(coverFileName, coverFileData);
                manifest += `<item id="cover-img" href="Images/${coverFileName}" media-type="image/${coverExtension === 'jpg' ? 'jpeg' : 'png'}" properties="cover-image"/>\n`;
                manifest += `<item id="cover-page" href="Text/cover.xhtml" media-type="application/xhtml+xml"/>\n`;
                spine += `<itemref idref="cover-page"/>\n`;
                
                textFolder.file("cover.xhtml", `<?xml version="1.0" encoding="utf-8"?>
                <html xmlns="http://www.w3.org/1999/xhtml">
                <head><title>Cover</title><style>body{margin:0;padding:0;text-align:center;} img{max-width:100%;height:auto;}</style></head>
                <body><div><img src="../Images/${coverFileName}" alt="Cover"/></div></body></html>`);
            }

            tocArray.forEach(item => {
                item.title = document.getElementById(`toc_input_${item.id}`).value;
            });
            tocArray.sort((a, b) => a.lineIndex - b.lineIndex);

            for (let i = 0; i < tocArray.length; i++) {
                let startLine = tocArray[i].lineIndex;
                let endLine = (i + 1 < tocArray.length) ? tocArray[i+1].lineIndex : textLines.length;
                let chapterTitle = escapeXml(tocArray[i].title);
                
                let chapterHtml = `<?xml version="1.0" encoding="utf-8"?>
                <html xmlns="http://www.w3.org/1999/xhtml">
                <head><title>${chapterTitle}</title></head>
                <body style="line-height: 1.6; word-break: break-all;">
                <h1 id="chapter_title" style="text-align:center; margin-bottom: 2em; padding-top: 2em; font-size: 1.5em; border-bottom: 1px solid #ccc; padding-bottom: 15px;">${chapterTitle}</h1>\n`;

                for (let j = startLine + 1; j < endLine; j++) {
                    let pText = textLines[j].trim();
                    if (pText.length === 0) {
                        chapterHtml += `<p><br/></p>\n`;
                    } else {
                        // 🌟 구분선 꾸미기 유지
                        let noSpaceText = pText.replace(/\s/g, '');
                        if (noSpaceText.length >= 3 && /^[\*\-\=※~]+$/.test(noSpaceText)) {
                            chapterHtml += `<div style="text-align: center; margin: 3em 0; color: #a0a0a0; letter-spacing: 0.5em; font-size: 1.2em;">${escapeXml(pText)}</div>\n`;
                        } else {
                            chapterHtml += `<p>${escapeXml(pText)}</p>\n`;
                        }
                    }
                }
                chapterHtml += `</body></html>`;
                
                let fileName = `chapter${i+1}.xhtml`;
                textFolder.file(fileName, chapterHtml);
                
                manifest += `<item id="chap${i+1}" href="Text/${fileName}" media-type="application/xhtml+xml"/>\n`;
                spine += `<itemref idref="chap${i+1}"/>\n`;
                navMap += `<navPoint id="navPoint-${i+1}" playOrder="${i+1}"><navLabel><text>${chapterTitle}</text></navLabel><content src="Text/${fileName}"/></navPoint>\n`;
                navOl += `<li><a href="${fileName}">${chapterTitle}</a></li>\n`;
            }

            let opf = `<?xml version="1.0" encoding="utf-8"?>
            <package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="pub-id">
                <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
                    <dc:title>${escapeXml(bookTitle)}</dc:title>
                    <dc:creator>${escapeXml(bookAuthor)}</dc:creator>
                    <dc:identifier id="pub-id">${uuid}</dc:identifier>
                    <dc:language>ko</dc:language>
                    ${coverFileData ? '<meta name="cover" content="cover-img"/>' : ''}
                </metadata>
                <manifest>${manifest}</manifest>
                <spine toc="ncx">${spine}</spine>
            </package>`;
            oebps.file("content.opf", opf);

            let ncx = `<?xml version="1.0" encoding="UTF-8"?>
            <ncx xmlns="http://www.daisy.org/z3998/2012/vocab/structure/#" version="2005-1">
                <head><meta name="dtb:uid" content="${uuid}"/></head>
                <docTitle><text>${escapeXml(bookTitle)}</text></docTitle>
                <navMap>${navMap}</navMap>
            </ncx>`;
            oebps.file("toc.ncx", ncx);

            let navXhtml = `<?xml version="1.0" encoding="utf-8"?>
            <html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops">
            <head><title>${escapeXml(bookTitle)}</title></head>
            <body><nav epub:type="toc"><h1>목차</h1><ol>${navOl}</ol></nav></body></html>`;
            textFolder.file("nav.xhtml", navXhtml);

            try {
                const blob = await zip.generateAsync({type: "blob", compression: "DEFLATE", compressionOptions: {level: 6}});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                let customFileName = document.getElementById('fileName').value.trim();
                if(!customFileName) customFileName = bookTitle + ".epub";
                if(!customFileName.toLowerCase().endsWith('.epub')) customFileName += ".epub";
                
                a.download = customFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                stat.innerText = "✅ 성공! '파일' 앱에서 다운로드한 도서를 확인하세요.";
                stat.className = "status success";
            } catch(e) {
                stat.innerText = "❌ 다운로드 오류: " + e.message;
                stat.className = "status error";
            }
        }
    </script>
</body>
</html>
